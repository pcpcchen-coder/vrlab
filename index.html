<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>35 kV SST Microgrid Innovation Lab</title>
  <style>
    @font-face {
      font-family: "Noto Sans TC";
      src: url("assets/notosans-tc.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --brand: #00A6E5;
      --panel-bg: rgba(17, 24, 39, 0.88);
      --panel-border: rgba(255, 255, 255, 0.14);
      --text: #f8fafc;
      --muted: #cbd5e1;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #eef2f6;
      font-family: "Noto Sans TC", Helvetica, "PingFang TC", system-ui, sans-serif;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #ui {
      position: fixed;
      top: 16px;
      right: 16px;
      width: min(310px, calc(100vw - 32px));
      color: var(--text);
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      box-shadow: 0 18px 45px rgba(15, 23, 42, 0.32);
      backdrop-filter: blur(14px);
      z-index: 10;
      user-select: none;
    }

    #ui header {
      padding: 14px 16px 10px;
      border-bottom: 1px solid var(--panel-border);
    }

    #ui h1 {
      margin: 0;
      color: white;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0;
      line-height: 1.35;
    }

    #ui .sub {
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    .ui-body {
      display: grid;
      gap: 12px;
      padding: 12px 14px 14px;
    }

    .section {
      display: grid;
      gap: 8px;
    }

    .section-title {
      color: #e2e8f0;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 28px;
      color: var(--muted);
      font-size: 13px;
    }

    .row strong {
      color: white;
      font-weight: 600;
    }

    .switch {
      display: inline-grid;
      grid-template-columns: auto 42px;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .switch input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .track {
      position: relative;
      width: 42px;
      height: 22px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.35);
      transition: background 160ms ease;
    }

    .track::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: white;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.28);
      transition: transform 160ms ease;
    }

    .switch input:checked + .track {
      background: var(--brand);
    }

    .switch input:checked + .track::after {
      transform: translateX(20px);
    }

    .button-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    button {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 6px;
      padding: 8px 10px;
      color: white;
      background: rgba(148, 163, 184, 0.16);
      font: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: background 160ms ease, border-color 160ms ease, transform 160ms ease;
    }

    button:hover,
    button.active {
      background: rgba(0, 166, 229, 0.32);
      border-color: rgba(0, 166, 229, 0.84);
    }

    button:active {
      transform: translateY(1px);
    }

    #status {
      position: fixed;
      left: 16px;
      bottom: 16px;
      max-width: min(520px, calc(100vw - 32px));
      padding: 9px 12px;
      color: #0f172a;
      background: rgba(255, 255, 255, 0.82);
      border: 1px solid rgba(15, 23, 42, 0.08);
      border-radius: 8px;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.12);
      font-size: 12px;
      line-height: 1.4;
      backdrop-filter: blur(12px);
      z-index: 9;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <aside id="ui" aria-label="Scene controls">
    <header>
      <h1>35 kV SST 微電網 Innovation Lab</h1>
      <div class="sub">Y-up / metric scale / engineering showcase</div>
    </header>
    <div class="ui-body">
      <section class="section">
        <div class="section-title">View</div>
        <div class="button-grid">
          <button id="viewTop" type="button">Top</button>
          <button id="viewIso" type="button" class="active">ISO</button>
          <button id="viewWalk" type="button">Walk</button>
        </div>
      </section>

      <section class="section">
        <div class="section-title">Building</div>
        <label class="row switch">
          <span>屋頂顯示</span>
          <input id="roofVisible" type="checkbox" checked />
          <span class="track"></span>
        </label>
        <label class="row switch">
          <span>屋頂半透明</span>
          <input id="roofTranslucent" type="checkbox" checked />
          <span class="track"></span>
        </label>
      </section>

      <section class="section">
        <div class="section-title">Circulation</div>
        <label class="row switch">
          <span>工程動線</span>
          <input id="pathEngineering" type="checkbox" checked />
          <span class="track"></span>
        </label>
        <label class="row switch">
          <span>卡車動線</span>
          <input id="pathTruck" type="checkbox" checked />
          <span class="track"></span>
        </label>
        <label class="row switch">
          <span>參觀動線</span>
          <input id="pathVisitor" type="checkbox" checked />
          <span class="track"></span>
        </label>
      </section>

      <section class="section">
        <div class="section-title">Equipment</div>
        <label class="row switch">
          <span>SST 內部剖面</span>
          <input id="sstCutaway" type="checkbox" />
          <span class="track"></span>
        </label>
        <label class="row switch">
          <span>BESS 內部剖面</span>
          <input id="bessCutaway" type="checkbox" />
          <span class="track"></span>
        </label>
      </section>
    </div>
  </aside>
  <div id="status">ISO 視角。快捷鍵：1 Top，2 ISO，3 Walk。Walk 模式可用 WASD / 方向鍵移動。</div>

  <script type="module">

    import { RectAreaLightUniformsLib } from "three/addons/lights/RectAreaLightUniformsLib.js";
    import { VRButton } from "three/addons/webxr/VRButton.js";
    import { XRControllerModelFactory } from "three/addons/webxr/XRControllerModelFactory.js";

    // === Global Constants ===
    const BRAND_COLOR = "#00A6E5";
    const UNIT = "m";
    const BUILDING = Object.freeze({

    const FLOOR = Object.freeze({

    const CAMERA = Object.freeze({

    const COLORS = Object.freeze({

      warmWhite: "#FFF4E0",
      exit: "#22C55E",

    });
    const OPENINGS = Object.freeze({
      truckDoor: { x1: 10, x2: 15, height: 5, label: "Truck Door 5 m x 5 m" },
      southExit: { x1: 34.4, x2: 35.6, height: 2.2, label: "Emergency Exit" },
      visitorDoor: { x1: 3, x2: 5, height: 2.5, label: "Visitor Entry" },
      northExit: { x1: 29.4, x2: 30.6, height: 2.2, label: "Emergency Exit" },
      engineeringDoor: { z1: 11.4, z2: 12.6, height: 2.2, label: "Engineering Entry" }
    });
    const EQUIPMENT_SIZES = Object.freeze({
      sst: { x: 6, z: 2.4, y: 2.6 },
      bess: { x: 12, z: 2.4, y: 2.6 },
      hvCabinet: { x: 4, z: 1.2, y: 2.4 },

      videoWallFoyer: { x: 4, y: 2 }
    });
    const ZONES = Object.freeze([
      { id: "Z1", zh: "展示前廳", en: "Innovation Showcase", x1: 0, z1: 11, x2: 14, z2: 14, color: COLORS.visitor },
      { id: "Z2", zh: "中控室", en: "Control Room", x1: 14, z1: 10, x2: 24, z2: 14, color: COLORS.visitor },
      { id: "Z3", zh: "參觀走廊", en: "Visitor Walkway", x1: 24, z1: 12, x2: 40, z2: 14, color: COLORS.visitor },
      { id: "Z4", zh: "配電與電網模擬區", en: "Grid Simulation", x1: 0, z1: 5, x2: 10, z2: 11, color: COLORS.highVoltage },
      { id: "Z5", zh: "SST 並聯測試區", en: "SST Parallel Test (35 kV)", x1: 10, z1: 5, x2: 22, z2: 11, color: COLORS.highVoltage },
      { id: "Z6", zh: "直流微電網試驗區", en: "DC Microgrid (BESS + DC Bus)", x1: 22, z1: 5, x2: 34, z2: 11, color: COLORS.highVoltage },
      { id: "Z7", zh: "工程操作區", en: "Engineering Workspace", x1: 34, z1: 5, x2: 40, z2: 14, color: COLORS.engineering },
      { id: "Z8", zh: "檢修走廊", en: "Maintenance Aisle", x1: 0, z1: 4, x2: 34, z2: 5, color: COLORS.engineering },
      { id: "Z9", zh: "卡車進出與吊裝通道", en: "Logistics & Lifting", x1: 0, z1: 0, x2: 34, z2: 4, color: COLORS.highVoltage }
    ]);
    const PATHS = Object.freeze({
      engineering: [
        [[39.2, 12], [37, 12]],
        [[37, 12], [37, 4.5]],
        [[37, 4.5], [5, 4.5]],
        [[5, 4.5], [5, 5.55]],
        [[16, 4.5], [16, 5.55]],
        [[28, 4.5], [28, 5.55]]
      ],
      truck: [
        [[12.5, 0.15], [12.5, 3]],
        [[12.5, 3], [27, 3]]
      ],
      visitor: [
        [[4, 13.85], [4, 13.05]],
        [[4, 13.05], [18, 13.05]],
        [[18, 13.05], [24, 13.05]],
        [[24, 13.05], [38.6, 13.05]],
        [[38.6, 13.05], [38.6, 13.85]]
      ]
    });
    const ROUTE_WIDTH = 0.3;
    const DASH = Object.freeze({ length: 0.62, gap: 0.38 });
    const GLASS_HEIGHT = 4.05;
    const GLASS_THICKNESS = 0.035;
    const FRAME_THICKNESS = 0.06;
    const CRANE = Object.freeze({
      x1: 2,
      x2: 34,
      railZ1: 3,
      railZ2: 11,
      railY: 8.5,
      columnStep: 4,
      hookMinX: 12,
      hookMaxX: 30,
      hookZ: 7
    });
    const LIGHT_GRID = Object.freeze({
      xStart: 2,
      xEnd: 38,
      zRows: [2, 6, 10, 13],
      step: 4,
      y: 8.55
    });
    const MATERIAL_DEFAULTS = Object.freeze({
      routeRoughness: 0.68,
      metalRoughness: 0.55,
      floorRoughness: 0.42
    });

    RectAreaLightUniformsLib.init();

    const scene = new THREE.Scene();
    scene.background = new THREE.Color("#EEF2F6");
    scene.fog = new THREE.Fog("#EEF2F6", 75, 150);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    // §2.7 Performance: shadows off (Quest GPU can't sustain) — castShadow flags throughout
    // the scene become no-ops because shadowMap.enabled is false.
    renderer.shadowMap.enabled = false;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.NoToneMapping;
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);

    // Show "Enter VR" button only if the browser supports immersive-vr.
    if (navigator.xr && typeof navigator.xr.isSessionSupported === "function") {
      navigator.xr.isSessionSupported("immersive-vr").then((supported) => {
        if (supported) {
          const vrButton = VRButton.createButton(renderer);
          vrButton.style.zIndex = 10;
          document.body.appendChild(vrButton);
        }
      }).catch(() => { /* silently ignore — desktop fallback already works */ });
    }

    const camera = new THREE.PerspectiveCamera(CAMERA.fov, window.innerWidth / window.innerHeight, CAMERA.near, CAMERA.far);

    // Dolly group: WebXR overrides camera pose every frame from the HMD; we move
    // the dolly to teleport / spawn, and the headset translates the camera within it.
    const dolly = new THREE.Group();
    dolly.name = "XR Dolly";
    dolly.add(camera);
    scene.add(dolly);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.minDistance = 5;
    controls.maxDistance = 88;
    controls.maxPolarAngle = Math.PI * 0.49;

    const root = new THREE.Group();
    root.name = "35 kV SST Microgrid Innovation Lab";
    scene.add(root);

    const roofGroup = new THREE.Group();
    roofGroup.name = "Toggleable roof group";
    root.add(roofGroup);

    const zoneGroup = new THREE.Group();
    zoneGroup.name = "Zones and floor markings";
    root.add(zoneGroup);

    const shellGroup = new THREE.Group();
    shellGroup.name = "Building shell";
    root.add(shellGroup);

    const safetyGroup = new THREE.Group();
    safetyGroup.name = "Safety glass and isolation";
    root.add(safetyGroup);

    const equipmentGroup = new THREE.Group();
    equipmentGroup.name = "Equipment";
    root.add(equipmentGroup);

    const pathGroups = {
      engineering: new THREE.Group(),
      truck: new THREE.Group(),
      visitor: new THREE.Group()
    };
    pathGroups.engineering.name = "Engineering route - dashed yellow";
    pathGroups.truck.name = "Truck route - solid red";
    pathGroups.visitor.name = "Visitor route - solid blue";
    root.add(pathGroups.engineering, pathGroups.truck, pathGroups.visitor);

    const conduitGroup = new THREE.Group();
    conduitGroup.name = "Reserved conduits";
    root.add(conduitGroup);

    const craneGroup = new THREE.Group();
    craneGroup.name = "10 t single-girder bridge crane";
    root.add(craneGroup);

    const sstCutawayTargets = [];
    const bessCutawayTargets = [];

    const mats = {
      wall: new THREE.MeshStandardMaterial({ color: COLORS.wall, roughness: 0.82, metalness: 0.02 }),
      roof: new THREE.MeshStandardMaterial({ color: COLORS.roof, roughness: 0.28, metalness: 0.22, transparent: true, opacity: 0.34 }),
      roofStripe: new THREE.MeshStandardMaterial({ color: "#DBE1E8", roughness: 0.42, metalness: 0.18 }),
      floor: new THREE.MeshStandardMaterial({ color: COLORS.floor, roughness: MATERIAL_DEFAULTS.floorRoughness, metalness: 0.08 }),
      brand: new THREE.MeshStandardMaterial({ color: COLORS.brand, emissive: COLORS.brand, emissiveIntensity: 0.62, roughness: 0.34 }),
      hv: new THREE.MeshStandardMaterial({ color: COLORS.highVoltage, roughness: MATERIAL_DEFAULTS.routeRoughness }),
      visitor: new THREE.MeshStandardMaterial({ color: COLORS.visitor, roughness: MATERIAL_DEFAULTS.routeRoughness }),
      engineering: new THREE.MeshStandardMaterial({ color: COLORS.engineering, roughness: MATERIAL_DEFAULTS.routeRoughness }),
      container: new THREE.MeshStandardMaterial({ color: COLORS.container, roughness: 0.74, metalness: 0.42 }),
      containerTransparent: new THREE.MeshStandardMaterial({ color: COLORS.container, roughness: 0.74, metalness: 0.42, transparent: true, opacity: 0.22, depthWrite: false }),
      // §2.7: was MeshPhysicalMaterial+transmission (heavy on Quest); now plain Standard.
      glass: new THREE.MeshStandardMaterial({
        color: COLORS.glass,
        roughness: 0.05,
        metalness: 0,
        transparent: true,
        opacity: 0.30,
        side: THREE.DoubleSide,
        depthWrite: false
      }),
      aluminum: new THREE.MeshStandardMaterial({ color: COLORS.aluminum, roughness: 0.34, metalness: 0.58 }),
      crane: new THREE.MeshStandardMaterial({ color: COLORS.crane, roughness: 0.52, metalness: 0.28 }),
      conduit: new THREE.MeshStandardMaterial({ color: COLORS.conduit, roughness: 0.75, metalness: 0.08 }),
      black: new THREE.MeshStandardMaterial({ color: COLORS.black, roughness: 0.58, metalness: 0.05 }),
      white: new THREE.MeshStandardMaterial({ color: COLORS.white, roughness: 0.38 }),
      coldLight: new THREE.MeshStandardMaterial({ color: COLORS.coldWhite, emissive: COLORS.coldWhite, emissiveIntensity: 1.2 }),
      redLight: new THREE.MeshStandardMaterial({ color: COLORS.highVoltage, emissive: COLORS.highVoltage, emissiveIntensity: 1.7 }),
      greenLight: new THREE.MeshStandardMaterial({ color: COLORS.exit, emissive: COLORS.exit, emissiveIntensity: 1.4 }),
      display: new THREE.MeshStandardMaterial({ color: "#08111F", emissive: "#0EA5E9", emissiveIntensity: 0.2, roughness: 0.36, metalness: 0.08 })
    };

    function makeMat(color, options = {}) {
      return new THREE.MeshStandardMaterial({ color, roughness: 0.72, metalness: 0.02, ...options });
    }

    function box(name, size, position, material, parent = root) {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(size.x, size.y, size.z), material);
      mesh.name = name;
      mesh.position.set(position.x, position.y, position.z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function cylinder(name, radiusTop, radiusBottom, height, radialSegments, position, material, parent = root) {
      const mesh = new THREE.Mesh(new THREE.CylinderGeometry(radiusTop, radiusBottom, height, radialSegments), material);
      mesh.name = name;
      mesh.position.set(position.x, position.y, position.z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function addFloorRect(x1, z1, x2, z2, color, parent, opacity = 0.055) {
      const geometry = new THREE.PlaneGeometry(x2 - x1, z2 - z1);
      const material = new THREE.MeshBasicMaterial({ color, transparent: true, opacity, depthWrite: false, side: THREE.DoubleSide });
      const plane = new THREE.Mesh(geometry, material);
      plane.name = "Zone floor tint";
      plane.rotation.x = -Math.PI / 2;
      plane.position.set((x1 + x2) / 2, FLOOR.borderY, (z1 + z2) / 2);
      parent.add(plane);
      return plane;
    }

    function addRectBorder(x1, z1, x2, z2, color, parent, width = 0.08) {
      const material = makeMat(color, { roughness: 0.68, metalness: 0.03 });
      box("Zone border north", { x: x2 - x1, y: 0.018, z: width }, { x: (x1 + x2) / 2, y: FLOOR.borderY + 0.012, z: z2 }, material, parent);
      box("Zone border south", { x: x2 - x1, y: 0.018, z: width }, { x: (x1 + x2) / 2, y: FLOOR.borderY + 0.012, z: z1 }, material, parent);
      box("Zone border east", { x: width, y: 0.018, z: z2 - z1 }, { x: x2, y: FLOOR.borderY + 0.012, z: (z1 + z2) / 2 }, material, parent);
      box("Zone border west", { x: width, y: 0.018, z: z2 - z1 }, { x: x1, y: FLOOR.borderY + 0.012, z: (z1 + z2) / 2 }, material, parent);
    }

    function createLabelTexture(lines, color = COLORS.brand) {
      // §2.7: shrunk from 1024x256 to 512x128 to cut sprite label memory by 75%.
      const canvas = document.createElement("canvas");
      canvas.width = 512;
      canvas.height = 128;
      const ctx = canvas.getContext("2d");
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.shadowColor = "rgba(255,255,255,0.85)";
      ctx.shadowBlur = 5;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillStyle = color;
      ctx.font = '700 28px Helvetica, "Noto Sans TC", "PingFang TC", sans-serif';
      ctx.fillText(lines[0], canvas.width / 2, 47);
      ctx.font = '600 22px Helvetica, "Noto Sans TC", "PingFang TC", sans-serif';
      ctx.fillText(lines[1], canvas.width / 2, 79);
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
      return texture;
    }

    function addSpriteLabel(name, lines, position, parent, scale = { x: 5.8, y: 1.45 }) {
      const material = new THREE.SpriteMaterial({ map: createLabelTexture(lines), transparent: true, depthWrite: false });
      const sprite = new THREE.Sprite(material);
      sprite.name = name;
      sprite.position.set(position.x, position.y, position.z);
      sprite.scale.set(scale.x, scale.y, 1);
      parent.add(sprite);
      return sprite;
    }

    function createPanelTexture(lines, options = {}) {
      const {
        width = 1024,
        height = 512,
        bg = "rgba(8,17,31,0.96)",
        fg = "#FFFFFF",
        accent = COLORS.brand,
        fontSize = 52
      } = options;
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, width, height);
      ctx.fillStyle = accent;
      ctx.fillRect(0, 0, width, 18);
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

    function addPathSegment(parent, start, end, color, dashed = false) {
      const material = makeMat(color, { roughness: MATERIAL_DEFAULTS.routeRoughness, metalness: 0.01 });
      const dx = end[0] - start[0];
      const dz = end[1] - start[1];
      const length = Math.hypot(dx, dz);
      const angle = -Math.atan2(dz, dx);
      const addDash = (offset, dashLength) => {
        const ratio = (offset + dashLength / 2) / length;
        const x = start[0] + dx * ratio;
        const z = start[1] + dz * ratio;
        const strip = box("Circulation path segment", { x: dashLength, y: 0.02, z: ROUTE_WIDTH }, { x, y: FLOOR.routeY, z }, material, parent);
        strip.rotation.y = angle;
      };
      if (dashed) {
        for (let offset = 0; offset < length; offset += DASH.length + DASH.gap) {
          addDash(offset, Math.min(DASH.length, length - offset));
        }
      } else {
        addDash(0, length);
      }
    }

        const dz = end[1] - start[1];
        const length = Math.hypot(dx, dz);
        const angle = -Math.atan2(dz, dx);
        for (let offset = 0; offset < length; offset += 0.48) {
          const dashLength = Math.min(0.28, length - offset);

          dash.rotation.y = angle;
        }
      }
      parent.add(group);
      return group;

    // === Emergency Stop Posts and Exit Signs ===

    function addExitSign(name, position, rotationY = 0) {

    // === Equipment Cutaway State ===
    function setCutaway(targets, enabled) {
      targets.forEach(({ shellParts, internals }) => {
        internals.visible = enabled;

    // === Camera Modes and UI ===
    const status = document.getElementById("status");
    const viewButtons = {
      top: document.getElementById("viewTop"),
      iso: document.getElementById("viewIso"),
      walk: document.getElementById("viewWalk")
    };
    const ui = {
      roofVisible: document.getElementById("roofVisible"),
      roofTranslucent: document.getElementById("roofTranslucent"),
      pathEngineering: document.getElementById("pathEngineering"),
      pathTruck: document.getElementById("pathTruck"),
      pathVisitor: document.getElementById("pathVisitor"),
      sstCutaway: document.getElementById("sstCutaway"),
      bessCutaway: document.getElementById("bessCutaway")
    };
    const viewState = {
      mode: "iso",
      walkYaw: -Math.PI / 2,
      walkPitch: 0,
      keys: new Set()
    };

    function setActiveButton(mode) {
      Object.entries(viewButtons).forEach(([key, button]) => button.classList.toggle("active", key === mode));
    }

    function setView(mode) {
      viewState.mode = mode;
      camera.up.set(0, 1, 0);
      controls.enabled = mode !== "walk";
      controls.enableRotate = mode !== "top";
      controls.enablePan = mode !== "top";
      if (mode === "top") {
        camera.position.set(20, CAMERA.topHeight, 7.001);
        controls.target.set(20, 0, 7);
        camera.lookAt(controls.target);
        status.textContent = "Top 俯視圖：檢查九區面積、玻璃隔斷和三條獨立動線。快捷鍵 2 返回 ISO。";
      }
      if (mode === "iso") {
        camera.position.set(36, 25, 25);
        controls.target.set(20, 2, 7);
        camera.lookAt(controls.target);
        status.textContent = "ISO 等角視角。滑鼠拖曳旋轉，滾輪縮放。快捷鍵 1 Top，3 Walk。";
      }
      if (mode === "walk") {
        camera.position.set(4.2, CAMERA.walkEyeHeight, 13.2);
        viewState.walkYaw = Math.PI / 2;
        viewState.walkPitch = -0.06;
        status.textContent = "Walk 第一人稱漫遊：WASD / 方向鍵移動，左右方向鍵轉向，Esc 回到滑鼠。";
        updateWalkCameraLook();
      }
      controls.update();
      setActiveButton(mode);
    }

    function updateWalkCameraLook() {
      const dir = new THREE.Vector3(
        Math.sin(viewState.walkYaw) * Math.cos(viewState.walkPitch),
        Math.sin(viewState.walkPitch),
        Math.cos(viewState.walkYaw) * Math.cos(viewState.walkPitch)
      );
      camera.lookAt(camera.position.clone().add(dir));
    }

    function updateWalk(delta) {
      if (viewState.mode !== "walk") return;
      const turnLeft = viewState.keys.has("ArrowLeft");
      const turnRight = viewState.keys.has("ArrowRight");
      const moveForward = viewState.keys.has("KeyW") || viewState.keys.has("ArrowUp");
      const moveBack = viewState.keys.has("KeyS") || viewState.keys.has("ArrowDown");
      const moveLeft = viewState.keys.has("KeyA");
      const moveRight = viewState.keys.has("KeyD");
      if (turnLeft) viewState.walkYaw += CAMERA.walkTurnSpeed * delta;
      if (turnRight) viewState.walkYaw -= CAMERA.walkTurnSpeed * delta;
      const forward = new THREE.Vector3(Math.sin(viewState.walkYaw), 0, Math.cos(viewState.walkYaw));
      const right = new THREE.Vector3(forward.z, 0, -forward.x);
      const move = new THREE.Vector3();
      if (moveForward) move.add(forward);
      if (moveBack) move.sub(forward);
      if (moveRight) move.add(right);
      if (moveLeft) move.sub(right);
      if (move.lengthSq() > 0) {
        move.normalize().multiplyScalar(CAMERA.walkSpeed * delta);
        camera.position.add(move);
        camera.position.x = THREE.MathUtils.clamp(camera.position.x, 0.8, BUILDING.widthX - 0.8);
        camera.position.z = THREE.MathUtils.clamp(camera.position.z, 0.8, BUILDING.depthZ - 0.8);
      }
      camera.position.y = CAMERA.walkEyeHeight;
      updateWalkCameraLook();
    }

    viewButtons.top.addEventListener("click", () => setView("top"));
    viewButtons.iso.addEventListener("click", () => setView("iso"));
    viewButtons.walk.addEventListener("click", () => setView("walk"));

    ui.roofVisible.addEventListener("change", () => { roofGroup.visible = ui.roofVisible.checked; });
    ui.roofTranslucent.addEventListener("change", () => {
      mats.roof.opacity = ui.roofTranslucent.checked ? 0.34 : 0.96;
      mats.roof.needsUpdate = true;
    });
    ui.pathEngineering.addEventListener("change", () => { pathGroups.engineering.visible = ui.pathEngineering.checked; });
    ui.pathTruck.addEventListener("change", () => { pathGroups.truck.visible = ui.pathTruck.checked; });
    ui.pathVisitor.addEventListener("change", () => { pathGroups.visitor.visible = ui.pathVisitor.checked; });
    ui.sstCutaway.addEventListener("change", () => setCutaway(sstCutawayTargets, ui.sstCutaway.checked));
    ui.bessCutaway.addEventListener("change", () => setCutaway(bessCutawayTargets, ui.bessCutaway.checked));

    // Mirror DOM toggles into spatial UI; the panel itself is built later (after its
    // helper consts like pxRect / BUTTONS are declared in the Spatial UI section).
    Object.values(ui).forEach((checkbox) => {
      checkbox.addEventListener("change", () => { if (typeof panelDirty !== "undefined") panelDirty = true; });
    });

    window.addEventListener("keydown", (event) => {
      const target = event.target;
      if (target instanceof HTMLInputElement || target instanceof HTMLButtonElement) return;
      if (event.code === "Digit1") setView("top");
      if (event.code === "Digit2") setView("iso");
      if (event.code === "Digit3") setView("walk");
      viewState.keys.add(event.code);
    });
    window.addEventListener("keyup", (event) => viewState.keys.delete(event.code));
    renderer.domElement.addEventListener("click", () => {
      if (viewState.mode === "walk" && document.pointerLockElement !== renderer.domElement) {
        renderer.domElement.requestPointerLock?.();
      }
    });
    window.addEventListener("mousemove", (event) => {
      if (viewState.mode !== "walk" || document.pointerLockElement !== renderer.domElement) return;
      viewState.walkYaw -= event.movementX * 0.0022;
      viewState.walkPitch = THREE.MathUtils.clamp(viewState.walkPitch - event.movementY * 0.0018, -0.45, 0.38);
    });
    window.addEventListener("resize", () => {
      // While XR is presenting, WebXR owns the projection matrix.
      if (renderer.xr.isPresenting) return;
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // === XR Session Lifecycle ===
    const SPAWN_POSITION = { x: 4, y: 0, z: 13.5 };  // visitor entry, eye-height added by HMD
    let baseReferenceSpace = null;
    const domUI = document.getElementById("ui");
    const statusBar = document.getElementById("status");

    renderer.xr.addEventListener("sessionstart", () => {
      controls.enabled = false;
      domUI.style.display = "none";
      statusBar.style.display = "none";
      baseReferenceSpace = renderer.xr.getReferenceSpace();
      // Spawn at visitor entry; reset before any user-initiated teleport.
      doTeleport(SPAWN_POSITION);
    });

    renderer.xr.addEventListener("sessionend", () => {
      controls.enabled = true;
      domUI.style.display = "";
      statusBar.style.display = "";
      baseReferenceSpace = null;
      // Restore desktop camera to a sensible default.
      setView(viewState.mode || "iso");
    });

    // Teleport helper (used by spawn + Reset button + parabolic teleport in §2.4).
    function doTeleport(target) {
      if (!baseReferenceSpace) return;
      const offsetTransform = new XRRigidTransform(
        { x: -target.x, y: -target.y, z: -target.z, w: 1 },
        { x: 0, y: 0, z: 0, w: 1 }
      );
      const teleportSpace = baseReferenceSpace.getOffsetReferenceSpace(offsetTransform);
      renderer.xr.setReferenceSpace(teleportSpace);
    }

    // === XR Controllers + Rays ===
    const controllerModelFactory = new XRControllerModelFactory();
    const controllers = [null, null];      // by xr index
    let leftController = null;             // resolved by handedness on 'connected'
    let rightController = null;

    for (let i = 0; i < 2; i++) {
      const controller = renderer.xr.getController(i);
      controller.userData.index = i;
      controller.addEventListener("connected", (event) => {
        controller.userData.handedness = event.data?.handedness || "unknown";
        if (controller.userData.handedness === "left") leftController = controller;
        else if (controller.userData.handedness === "right") rightController = controller;
        controller.userData.gamepad = event.data?.gamepad || null;
      });
      controller.addEventListener("disconnected", () => {
        if (leftController === controller) leftController = null;
        if (rightController === controller) rightController = null;
        controller.userData.handedness = null;
        controller.userData.gamepad = null;
      });
      controller.addEventListener("selectstart", () => onSelectStart(controller));
      controller.addEventListener("selectend", () => onSelectEnd(controller));

      // Visual ray (5m blue line; brand color #00A6E5).
      const rayGeo = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(0, 0, 0),
        new THREE.Vector3(0, 0, -1)
      ]);
      const rayMat = new THREE.LineBasicMaterial({
        color: 0x00A6E5,
        transparent: true,
        opacity: 0.85,
        toneMapped: false
      });
      const ray = new THREE.Line(rayGeo, rayMat);
      ray.name = "controllerRay";
      ray.scale.z = 5;
      controller.add(ray);

      // Controller mesh on grip.
      const grip = renderer.xr.getControllerGrip(i);
      grip.add(controllerModelFactory.createControllerModel(grip));

      dolly.add(controller);
      dolly.add(grip);
      controllers[i] = controller;
      controller.userData.grip = grip;
    }

    // selectstart/end stubs — wired up to teleport / panel / cutaway in later steps.
    function onSelectStart(controller) {
      // dispatch order: panel > cutaway > teleport-aim (defined in §2.5/2.6/2.4)
      if (typeof handlePanelSelectStart === "function" && handlePanelSelectStart(controller)) return;
      if (typeof handleCutawaySelectStart === "function" && handleCutawaySelectStart(controller)) return;
      if (typeof handleTeleportSelectStart === "function") handleTeleportSelectStart(controller);
    }
    function onSelectEnd(controller) {
      if (typeof handleTeleportSelectEnd === "function") handleTeleportSelectEnd(controller);
    }

    // Haptic helper.
    function pulseHaptic(controller, intensity = 0.3, duration = 30) {
      const gp = controller?.userData?.gamepad;
      const actuator = gp?.hapticActuators?.[0];
      if (actuator?.pulse) actuator.pulse(intensity, duration);
    }

    // === Parabolic Teleport ===
    // Whitelist (visitor zones + maintenance aisle inner edge) and explicit forbidden zones.
    const TELEPORT_ZONES = [
      { id: "Z1", x0: 0,  x1: 14, z0: 11,  z1: 14, allow: true  },
      { id: "Z2", x0: 14, x1: 24, z0: 10,  z1: 14, allow: true  },
      { id: "Z3", x0: 24, x1: 40, z0: 12,  z1: 14, allow: true  },
      // Z8 maintenance aisle, only inner 0.5m strip facing the lab.
      { id: "Z8", x0: 0,  x1: 34, z0: 4.5, z1: 5.0, allow: true  },
      { id: "Z4", x0: 0,  x1: 10, z0: 5,   z1: 11, allow: false },
      { id: "Z5", x0: 10, x1: 22, z0: 5,   z1: 11, allow: false },
      { id: "Z6", x0: 22, x1: 34, z0: 5,   z1: 11, allow: false },
      { id: "Z9", x0: 0,  x1: 34, z0: 0,   z1: 4,  allow: false }
    ];

    function classifyTeleport(point) {
      for (const z of TELEPORT_ZONES) {
        if (z.allow && point.x >= z.x0 && point.x <= z.x1 && point.z >= z.z0 && point.z <= z.z1) {
          return { valid: true, zone: z.id };
        }
      }
      for (const z of TELEPORT_ZONES) {
        if (!z.allow && point.x >= z.x0 && point.x <= z.x1 && point.z >= z.z0 && point.z <= z.z1) {
          return { valid: false, zone: z.id };
        }
      }
      return { valid: false, zone: "OOB" };
    }

    // Closed-form parabola: arc(t) = P + D·v0·t + 0.5·g·t²
    const ARC_SAMPLES = 32;
    const ARC_DT = 0.05;
    const ARC_V0 = 8;
    const ARC_G = 9.8;
    const arcPoints = Array.from({ length: ARC_SAMPLES }, () => new THREE.Vector3());
    const _tmpControllerPos = new THREE.Vector3();
    const _tmpControllerDir = new THREE.Vector3();
    const _tmpQuat = new THREE.Quaternion();

    function buildArc(controller) {
      controller.getWorldPosition(_tmpControllerPos);
      controller.getWorldQuaternion(_tmpQuat);
      // Controller forward = its local -Z axis in world space.
      _tmpControllerDir.set(0, 0, -1).applyQuaternion(_tmpQuat).normalize();
      for (let i = 0; i < ARC_SAMPLES; i++) {
        const t = i * ARC_DT;
        arcPoints[i].set(
          _tmpControllerPos.x + _tmpControllerDir.x * ARC_V0 * t,
          _tmpControllerPos.y + _tmpControllerDir.y * ARC_V0 * t - 0.5 * ARC_G * t * t,
          _tmpControllerPos.z + _tmpControllerDir.z * ARC_V0 * t
        );
      }
    }

    function findFloorHit() {
      for (let i = 1; i < ARC_SAMPLES; i++) {
        const a = arcPoints[i - 1];
        const b = arcPoints[i];
        if (a.y >= 0 && b.y < 0) {
          const t = a.y / (a.y - b.y);
          const hit = new THREE.Vector3().lerpVectors(a, b, t);
          hit.y = 0;
          return { hit, index: i };
        }
      }
      return null;
    }

    // Visual: line for the arc, ring on the floor for the reticle.
    const arcGeo = new THREE.BufferGeometry();
    arcGeo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(ARC_SAMPLES * 3), 3));
    const arcMat = new THREE.LineBasicMaterial({
      color: 0x00A6E5,
      transparent: true,
      opacity: 0.9,
      toneMapped: false
    });
    const arcLine = new THREE.Line(arcGeo, arcMat);
    arcLine.frustumCulled = false;
    arcLine.visible = false;
    scene.add(arcLine);

    const reticleGeo = new THREE.RingGeometry(0.34, 0.40, 48);
    reticleGeo.rotateX(-Math.PI / 2);
    const reticleMat = new THREE.MeshBasicMaterial({
      color: 0x00A6E5,
      transparent: true,
      opacity: 0.75,
      side: THREE.DoubleSide,
      toneMapped: false,
      depthTest: false
    });
    const reticle = new THREE.Mesh(reticleGeo, reticleMat);
    reticle.renderOrder = 998;
    reticle.visible = false;
    scene.add(reticle);

    const COLOR_VALID = new THREE.Color(0x00A6E5);
    const COLOR_INVALID = new THREE.Color(0xE63946);

    // Per-controller aim state.
    const teleportState = {
      aimingController: null,
      lastValid: null  // { hit, zone } for selectend
    };

    function handleTeleportSelectStart(controller) {
      teleportState.aimingController = controller;
      // Hide the ray while aiming so the visual is clean.
      const ray = controller.children.find((c) => c.name === "controllerRay");
      if (ray) ray.visible = false;
    }

    function handleTeleportSelectEnd(controller) {
      if (teleportState.aimingController !== controller) return;
      const ray = controller.children.find((c) => c.name === "controllerRay");
      if (ray) ray.visible = true;
      arcLine.visible = false;
      reticle.visible = false;
      const last = teleportState.lastValid;
      teleportState.aimingController = null;
      teleportState.lastValid = null;
      if (last && last.valid) {
        doTeleport(last.hit);
        pulseHaptic(controller, 0.5, 60);
      }
    }

    function updateTeleportAim() {
      const c = teleportState.aimingController;
      if (!c) return;
      buildArc(c);
      const hitInfo = findFloorHit();
      if (!hitInfo) {
        teleportState.lastValid = { valid: false, hit: null };
        arcLine.material.color.copy(COLOR_INVALID);
        arcLine.visible = true;
        reticle.visible = false;
        const pos = arcGeo.attributes.position;
        for (let i = 0; i < ARC_SAMPLES; i++) {
          pos.setXYZ(i, arcPoints[i].x, arcPoints[i].y, arcPoints[i].z);
        }
        pos.needsUpdate = true;
        arcGeo.setDrawRange(0, ARC_SAMPLES);
        return;
      }
      const cls = classifyTeleport(hitInfo.hit);
      teleportState.lastValid = { valid: cls.valid, hit: hitInfo.hit, zone: cls.zone };

      // Update arc geometry up to the hit sample.
      const pos = arcGeo.attributes.position;
      for (let i = 0; i < hitInfo.index; i++) {
        pos.setXYZ(i, arcPoints[i].x, arcPoints[i].y, arcPoints[i].z);
      }
      pos.setXYZ(hitInfo.index, hitInfo.hit.x, hitInfo.hit.y, hitInfo.hit.z);
      pos.needsUpdate = true;
      arcGeo.setDrawRange(0, hitInfo.index + 1);

      const color = cls.valid ? COLOR_VALID : COLOR_INVALID;
      arcLine.material.color.copy(color);
      reticle.material.color.copy(color);
      arcLine.visible = true;
      reticle.position.set(hitInfo.hit.x, 0.02, hitInfo.hit.z);
      reticle.visible = true;
    }

    // === Spatial UI Panel (mounted on left grip) ===
    const PANEL_W_PX = 512;
    const PANEL_H_PX = 819;
    const PANEL_W_M = 0.25;
    const PANEL_H_M = 0.40;

    // UV is (x/PANEL_W_PX, 1 - y/PANEL_H_PX) — Three.js UV origin is bottom-left.
    const px2u = (x) => x / PANEL_W_PX;
    const py2v = (y) => 1 - y / PANEL_H_PX;
    const pxRect = (x, y, w, h) => ({
      uMin: px2u(x), uMax: px2u(x + w),
      vMin: py2v(y + h), vMax: py2v(y),
      pxX: x, pxY: y, pxW: w, pxH: h
    });

    // Toggle a DOM checkbox so the existing change handlers fire (single source of truth).
    function toggleDOMCheckbox(checkbox) {
      checkbox.checked = !checkbox.checked;
      checkbox.dispatchEvent(new Event("change"));
      panelDirty = true;
    }

    // Helper: end the active XR session (Exit button).
    function exitXRSession() {
      const session = renderer.xr.getSession();
      if (session) session.end();
    }

    // Buttons — declared as a function so DOM `ui` object exists by the time it's called.
    let BUTTONS = null;
    function buildButtonTable() {
      BUTTONS = [
        // --- Section 1: View ---
        { name: "view_top", kind: "momentary", label_zh: "頂視", label_en: "Top",
          ...pxRect(16, 68, 150, 80),
          onActivate: () => doTeleport({ x: 18, y: 25, z: 7.5 }) },
        { name: "view_iso", kind: "momentary", label_zh: "等角", label_en: "ISO",
          ...pxRect(181, 68, 150, 80),
          onActivate: () => doTeleport({ x: 30, y: 8, z: 20 }) },
        { name: "view_exit", kind: "momentary", label_zh: "出口", label_en: "Exit",
          ...pxRect(346, 68, 150, 80),
          onActivate: () => exitXRSession() },

        // --- Section 2: Layers ---
        { name: "roof", kind: "toggle", label_zh: "屋頂", label_en: "Roof",
          ...pxRect(16, 216, 230, 70),
          getState: () => ui.roofVisible.checked,
          onActivate: () => toggleDOMCheckbox(ui.roofVisible) },
        { name: "glass", kind: "toggle", label_zh: "玻璃", label_en: "Glass",
          ...pxRect(266, 216, 230, 70),
          getState: () => safetyGroup.visible,
          onActivate: () => { safetyGroup.visible = !safetyGroup.visible; panelDirty = true; } },
        { name: "pathEng", kind: "toggle", label_zh: "工程", label_en: "Eng",
          ...pxRect(16, 296, 230, 70),
          getState: () => ui.pathEngineering.checked,
          onActivate: () => toggleDOMCheckbox(ui.pathEngineering) },
        { name: "pathTruck", kind: "toggle", label_zh: "卡車", label_en: "Truck",
          ...pxRect(266, 296, 230, 70),
          getState: () => ui.pathTruck.checked,
          onActivate: () => toggleDOMCheckbox(ui.pathTruck) },
        { name: "pathVis", kind: "toggle", label_zh: "參觀", label_en: "Visitor",
          ...pxRect(16, 376, 230, 70),
          getState: () => ui.pathVisitor.checked,
          onActivate: () => toggleDOMCheckbox(ui.pathVisitor) },
        { name: "crane", kind: "toggle", label_zh: "行吊", label_en: "Crane",
          ...pxRect(266, 376, 230, 70),
          getState: () => craneGroup.visible,
          onActivate: () => { craneGroup.visible = !craneGroup.visible; panelDirty = true; } },

        // --- Section 3: Equipment ---
        { name: "sstCut", kind: "toggle", label_zh: "SST 剖面", label_en: "SST Cutaway",
          ...pxRect(16, 524, 480, 70),
          getState: () => ui.sstCutaway.checked,
          onActivate: () => toggleDOMCheckbox(ui.sstCutaway) },
        { name: "bessCut", kind: "toggle", label_zh: "BESS 剖面", label_en: "BESS Cutaway",
          ...pxRect(16, 604, 480, 70),
          getState: () => ui.bessCutaway.checked,
          onActivate: () => toggleDOMCheckbox(ui.bessCutaway) },

        // --- Reset ---
        { name: "reset", kind: "momentary", label_zh: "回起點", label_en: "Reset Pos",
          ...pxRect(16, 708, 480, 80),
          onActivate: () => doTeleport(SPAWN_POSITION) }
      ];
    }

    // Canvas + texture + meshes.
    const panelCanvas = document.createElement("canvas");
    panelCanvas.width = PANEL_W_PX;
    panelCanvas.height = PANEL_H_PX;
    const panelCtx = panelCanvas.getContext("2d");
    const panelTex = new THREE.CanvasTexture(panelCanvas);
    panelTex.colorSpace = THREE.SRGBColorSpace;
    panelTex.minFilter = THREE.LinearFilter;
    panelTex.magFilter = THREE.LinearFilter;
    const panelMat = new THREE.MeshBasicMaterial({
      map: panelTex,
      transparent: true,
      toneMapped: false,
      depthWrite: false
    });
    const panelMesh = new THREE.Mesh(new THREE.PlaneGeometry(PANEL_W_M, PANEL_H_M), panelMat);
    panelMesh.name = "XR UI Panel";
    panelMesh.visible = false;     // shown only after attaching to left grip
    panelMesh.renderOrder = 990;

    // Hover overlay: separate plane child, only its transform updates each frame.
    const hoverMat = new THREE.MeshBasicMaterial({
      color: 0x00A6E5,
      transparent: true,
      opacity: 0.32,
      depthTest: false,
      depthWrite: false,
      toneMapped: false
    });
    const hoverMesh = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), hoverMat);
    hoverMesh.visible = false;
    hoverMesh.renderOrder = 999;
    panelMesh.add(hoverMesh);

    let panelDirty = true;
    let currentHover = null;       // button object (or null)

    function rrect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function drawPanelToCanvas() {
      const ctx = panelCtx;
      ctx.clearRect(0, 0, PANEL_W_PX, PANEL_H_PX);
      // Background
      rrect(ctx, 4, 4, PANEL_W_PX - 8, PANEL_H_PX - 8, 22);
      ctx.fillStyle = "rgba(15, 23, 42, 0.94)";
      ctx.fill();
      ctx.strokeStyle = "rgba(0, 166, 229, 0.55)";
      ctx.lineWidth = 2;
      ctx.stroke();

      // Section headers
      ctx.font = "600 24px 'Helvetica Neue', Helvetica, system-ui, sans-serif";
      ctx.fillStyle = "#94A3B8";
      ctx.textBaseline = "alphabetic";
      ctx.fillText("視角  /  View", 18, 50);
      ctx.fillText("圖層  /  Layers", 18, 198);
      ctx.fillText("設備  /  Equipment", 18, 506);

      // Dividers
      ctx.strokeStyle = "#334155";
      ctx.lineWidth = 1;
      [156, 464, 692].forEach((y) => {
        ctx.beginPath();
        ctx.moveTo(18, y);
        ctx.lineTo(PANEL_W_PX - 18, y);
        ctx.stroke();
      });

      // Buttons
      for (const b of BUTTONS) drawButton(ctx, b);
    }

    function drawButton(ctx, b) {
      const { pxX: x, pxY: y, pxW: w, pxH: h } = b;
      const checked = b.kind === "toggle" && typeof b.getState === "function" ? b.getState() : false;

      rrect(ctx, x, y, w, h, 10);
      ctx.fillStyle = checked ? "rgba(0, 166, 229, 0.20)" : "#1E293B";
      ctx.fill();
      ctx.strokeStyle = checked ? "#00A6E5" : "#475569";
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // Labels: zh top, en bottom (same rendering as kiosks).
      ctx.fillStyle = "#E2E8F0";
      ctx.font = "600 24px 'Helvetica Neue', Helvetica, 'Noto Sans TC', system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "alphabetic";
      ctx.fillText(b.label_zh, x + w / 2, y + h / 2 - 4);
      ctx.font = "500 18px 'Helvetica Neue', Helvetica, system-ui, sans-serif";
      ctx.fillStyle = "#94A3B8";
      ctx.fillText(b.label_en, x + w / 2, y + h / 2 + 22);
      ctx.textAlign = "left";

      // Toggle indicator (filled square when checked).
      if (b.kind === "toggle") {
        const boxSize = 18;
        const bx = x + w - boxSize - 14;
        const by = y + (h - boxSize) / 2;
        rrect(ctx, bx, by, boxSize, boxSize, 4);
        ctx.fillStyle = checked ? "#00A6E5" : "#0F172A";
        ctx.fill();
        ctx.strokeStyle = checked ? "#00A6E5" : "#64748B";
        ctx.lineWidth = 1.5;
        ctx.stroke();
        if (checked) {
          ctx.strokeStyle = "#FFFFFF";
          ctx.lineWidth = 2.4;
          ctx.beginPath();
          ctx.moveTo(bx + 4, by + boxSize / 2);
          ctx.lineTo(bx + boxSize / 2 - 1, by + boxSize - 5);
          ctx.lineTo(bx + boxSize - 3, by + 5);
          ctx.stroke();
        }
      }
    }

    function maybeRedrawPanel() {
      if (!panelDirty || !BUTTONS) return;
      drawPanelToCanvas();
      panelTex.needsUpdate = true;
      panelDirty = false;
    }

    function hitTestPanel(uv) {
      if (!BUTTONS) return null;
      for (const b of BUTTONS) {
        if (uv.x >= b.uMin && uv.x <= b.uMax && uv.y >= b.vMin && uv.y <= b.vMax) return b;
      }
      return null;
    }

    function setPanelHover(button) {
      if (button === currentHover) return;
      currentHover = button;
      if (!button) {
        hoverMesh.visible = false;
        return;
      }
      const uMid = (button.uMin + button.uMax) / 2;
      const vMid = (button.vMin + button.vMax) / 2;
      const uW = button.uMax - button.uMin;
      const vH = button.vMax - button.vMin;
      hoverMesh.position.set((uMid - 0.5) * PANEL_W_M, (vMid - 0.5) * PANEL_H_M, 0.001);
      hoverMesh.scale.set(uW * PANEL_W_M, vH * PANEL_H_M, 1);
      hoverMesh.visible = true;
      // Hover-enter haptic on the right (pointing) controller.
      if (rightController) pulseHaptic(rightController, 0.3, 25);
    }

    // Attach panel to left grip when handedness resolves.
    function attachPanelToLeftGrip(grip) {
      if (panelMesh.parent === grip) return;
      if (panelMesh.parent) panelMesh.parent.remove(panelMesh);
      grip.add(panelMesh);
      panelMesh.position.set(0.05, 0.05, -0.10);
      panelMesh.rotation.set(-Math.PI / 4, 0, 0);
      panelMesh.visible = true;
    }

    // Right-controller raycast against the panel each frame.
    const _panelRay = new THREE.Raycaster();
    const _rayDir = new THREE.Vector3();
    const _rayOrigin = new THREE.Vector3();
    const _rayQuat = new THREE.Quaternion();

    function updatePanelRaycast() {
      maybeRedrawPanel();
      if (!rightController || !panelMesh.visible) {
        setPanelHover(null);
        return;
      }
      // Don't raycast when actively aiming a teleport.
      if (teleportState.aimingController === rightController) {
        setPanelHover(null);
        return;
      }
      rightController.getWorldPosition(_rayOrigin);
      rightController.getWorldQuaternion(_rayQuat);
      _rayDir.set(0, 0, -1).applyQuaternion(_rayQuat).normalize();
      _panelRay.set(_rayOrigin, _rayDir);
      _panelRay.far = 2.5;
      const hits = _panelRay.intersectObject(panelMesh, false);
      if (hits.length === 0) {
        setPanelHover(null);
        return;
      }
      const button = hitTestPanel(hits[0].uv);
      setPanelHover(button);
    }

    // Wire selectstart for panel — return true to consume the event.
    function handlePanelSelectStart(controller) {
      if (controller !== rightController) return false;
      if (!currentHover) return false;
      currentHover.onActivate?.();
      panelDirty = true;
      pulseHaptic(controller, 0.45, 50);
      return true;
    }

    // Now wire the connected listener to attach panel + resolve handedness.
    // We re-bind on connected so swapping controllers (rare but possible) still works.
    controllers.forEach((c) => {
      c.addEventListener("connected", (event) => {
        if (event.data?.handedness === "left" && c.userData.grip) {
          attachPanelToLeftGrip(c.userData.grip);
          panelDirty = true;
        }
      });
    });

    // === SST/BESS Cutaway Interaction ===
    const HIGHLIGHT_COLOR = new THREE.Color(0x00A6E5);
    const cutawayPickMeshes = [];
    let hoveredCutawayGroup = null;
    let cutawayFloatingLabels = new Map();   // group -> Sprite

    function buildCutawayPickList() {
      cutawayPickMeshes.length = 0;
      const all = [...sstCutawayTargets, ...bessCutawayTargets];
      for (const target of all) {
        const group = target.group;
        const kind = sstCutawayTargets.includes(target) ? "sst" : "bess";
        group.traverse((child) => {
          if ((child.isMesh || child.isInstancedMesh) && !child.isSprite) {
            child.userData.cutawayContainer = group;
            child.userData.cutawayTarget = target;
            child.userData.cutawayKind = kind;
            cutawayPickMeshes.push(child);
          }
        });
        // Pre-create a floating label sprite (hidden by default).
        const labelLines = kind === "sst"
          ? ["5 MW Solid State Transformer", "35 kV / 集裝箱式 SST"]
          : ["12 MWh Battery Energy Storage", "1500 V DC / 模組陣列"];
        const labelTex = createPanelTexture(labelLines, { width: 768, height: 192, fontSize: 38 });
        const labelMat = new THREE.SpriteMaterial({ map: labelTex, transparent: true, depthWrite: false, toneMapped: false });
        const sprite = new THREE.Sprite(labelMat);
        sprite.scale.set(3.2, 0.8, 1);
        // Position above the container shell (containers center at floor; height is .y of EQUIPMENT_SIZES).
        const sizeY = kind === "sst" ? EQUIPMENT_SIZES.sst.y : EQUIPMENT_SIZES.bess.y;
        sprite.position.set(0, sizeY + 0.6, 0);
        sprite.visible = false;
        group.add(sprite);
        cutawayFloatingLabels.set(group, sprite);
      }
    }

    function applyCutawayHighlight(group) {
      group.traverse((m) => {
        if (!m.isMesh && !m.isInstancedMesh) return;
        if (!m.material || !m.material.emissive) return;
        if (!m.userData._origMatCloned) {
          m.material = m.material.clone();
          m.userData._origMatCloned = true;
          m.userData._origEmissive = m.material.emissive.clone();
          m.userData._origIntensity = m.material.emissiveIntensity ?? 1;
        }
        m.material.emissive.copy(HIGHLIGHT_COLOR);
        m.material.emissiveIntensity = 0.45;
      });
    }

    function clearCutawayHighlight(group) {
      group.traverse((m) => {
        if (!m.userData?._origMatCloned) return;
        if (!m.material?.emissive) return;
        m.material.emissive.copy(m.userData._origEmissive);
        m.material.emissiveIntensity = m.userData._origIntensity;
      });
    }

    function setCutawayHover(group) {
      if (group === hoveredCutawayGroup) return;
      if (hoveredCutawayGroup) clearCutawayHighlight(hoveredCutawayGroup);
      hoveredCutawayGroup = group;
      if (group) {
        applyCutawayHighlight(group);
        if (rightController) pulseHaptic(rightController, 0.25, 20);
      }
    }

    function updateCutawayHoverPick() {
      if (!rightController) { setCutawayHover(null); return; }
      // Suppress while teleport-aiming or panel hovered.
      if (teleportState.aimingController === rightController) { setCutawayHover(null); return; }
      if (currentHover) { setCutawayHover(null); return; }
      rightController.getWorldPosition(_rayOrigin);
      rightController.getWorldQuaternion(_rayQuat);
      _rayDir.set(0, 0, -1).applyQuaternion(_rayQuat).normalize();
      _panelRay.set(_rayOrigin, _rayDir);
      _panelRay.far = 18;
      const hits = _panelRay.intersectObjects(cutawayPickMeshes, false);
      if (hits.length === 0) { setCutawayHover(null); return; }
      setCutawayHover(hits[0].object.userData.cutawayContainer);
    }

    function refreshCutawayFloatingLabels() {
      const sstOn = ui.sstCutaway.checked;
      const bessOn = ui.bessCutaway.checked;
      cutawayFloatingLabels.forEach((sprite, group) => {
        const isSst = sstCutawayTargets.some((t) => t.group === group);
        sprite.visible = isSst ? sstOn : bessOn;
      });
    }

    function handleCutawaySelectStart(controller) {
      if (controller !== rightController) return false;
      if (!hoveredCutawayGroup) return false;
      // Find which target this group belongs to, then toggle the matching DOM checkbox.
      const isSst = sstCutawayTargets.some((t) => t.group === hoveredCutawayGroup);
      const checkbox = isSst ? ui.sstCutaway : ui.bessCutaway;
      toggleDOMCheckbox(checkbox);   // existing change handler calls setCutaway()
      refreshCutawayFloatingLabels();
      pulseHaptic(controller, 0.55, 70);
      return true;
    }

    // === Validation Helpers Exposed for Console QA ===
    window.lab3d = {
      unit: UNIT,
      zones: ZONES.map((zone) => ({ ...zone, area: (zone.x2 - zone.x1) * (zone.z2 - zone.z1) })),
      minClearHeight: BUILDING.minClearHeight,
      craneCoverage: { x1: CRANE.x1, x2: CRANE.x2, z1: CRANE.railZ1, z2: CRANE.railZ2, railY: CRANE.railY },
      setView,
      setCutaway
    };

    setView("iso");
    setCutaway(sstCutawayTargets, false);
    setCutaway(bessCutawayTargets, false);

    // Build the VR raycast pick list and panel button table now that all dependencies
    // (containers, pxRect/BUTTONS helpers, panel state vars) are declared.
    buildCutawayPickList();
    refreshCutawayFloatingLabels();
    buildButtonTable();
    panelDirty = true;
    ui.sstCutaway.addEventListener("change", refreshCutawayFloatingLabels);
    ui.bessCutaway.addEventListener("change", refreshCutawayFloatingLabels);

    const clock = new THREE.Clock();
    function animate() {
      const elapsed = clock.getElapsedTime();
      const delta = Math.min(clock.getDelta(), 0.05);
      const craneTravel = (Math.sin(elapsed * 0.38) + 1) / 2;
      movingBridge.position.x = THREE.MathUtils.lerp(CRANE.hookMinX, CRANE.hookMaxX, craneTravel);
      movingBridge.position.y = Math.sin(elapsed * 1.1) * 0.035;
      if (renderer.xr.isPresenting) {
        updatePanelRaycast();
        updateCutawayHoverPick();
        updateTeleportAim();
      } else {
        updateWalk(delta);
        controls.update();
      }
      renderer.render(scene, camera);
    }
    renderer.setAnimationLoop(animate);
  </script>
</body>
</html>
